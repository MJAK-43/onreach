name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, preprod, 'feature/**']
    paths:
      - 'backend/**'
      - 'deployments/**'
      - '.gitattributes'
      - '.github/workflows/backend.yml'
      - '.github/workflows/reusable-backend-quality.yml'
      - '.github/workflows/reusable-preflight.yml'
  pull_request:
    branches: [main, preprod, develop]
    paths:
      - 'backend/**'
      - 'deployments/**'
      - '.gitattributes'

jobs:
  preflight:
    uses: ./.github/workflows/reusable-preflight.yml

  quality:
    needs: preflight
    uses: ./.github/workflows/reusable-backend-quality.yml
