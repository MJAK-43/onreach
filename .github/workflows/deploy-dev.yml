name: Deploy DEV

on:
  workflow_dispatch:
  push:
    branches: [develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: Build deployment archive
        run: |
          tar -czf /tmp/onreach-deploy.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=backend/vendor \
            --exclude=backend/var \
            --exclude=frontend/dist \
            --exclude=frontend/node_modules \
            --exclude=.env \
            --exclude=backend/.env \
            --exclude=backend/.env.dev \
            --exclude=backend/.env.test \
            -C "${{ github.workspace }}" .

      - name: Upload to DEV server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          source: /tmp/onreach-deploy.tar.gz
          target: /tmp

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="/opt/onreach/app"
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/onreach-deploy.tar.gz -C "$APP_DIR"
            rm -f /tmp/onreach-deploy.tar.gz
            chmod +x "$APP_DIR"/deployments/scripts/*.sh "$APP_DIR"/backend/docker/entrypoint.sh 2>/dev/null || true
            if [ ! -f "$APP_DIR/.env.dev" ]; then
              echo "ERROR: .env.dev missing on server — run initial deploy first"
              exit 1
            fi
            bash "$APP_DIR/deployments/scripts/deploy-dev.sh"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            set -e
            for i in $(seq 1 20); do
              API=$(curl -sf -o /dev/null -w "%{http_code}" https://api.onreach.inovixora.fr/health || echo "000")
              AI=$(curl -sf -o /dev/null -w "%{http_code}" https://ai.onreach.inovixora.fr/health || echo "000")
              DEV=$(curl -sf -o /dev/null -w "%{http_code}" https://dev.onreach.inovixora.fr/ || echo "000")
              echo "Attempt $i: api=$API ai=$AI dev=$DEV"
              if [ "$API" = "200" ] && [ "$AI" = "200" ] && [ "$DEV" = "200" ]; then
                curl -sf https://api.onreach.inovixora.fr/health
                echo
                curl -sf https://ai.onreach.inovixora.fr/health
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after retries"
            exit 1
