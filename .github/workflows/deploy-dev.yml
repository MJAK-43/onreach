name: Deploy DEV

on:
  push:
    branches: [develop]

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy to DEV server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR="/opt/onreach/app"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/MJAK-43/onreach.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              if [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                cd "$APP_DIR"
                git init
                git remote add origin "$REPO_URL"
                git fetch origin develop
                git checkout -f develop
                git branch --set-upstream-to=origin/develop develop
              else
                git clone --branch develop "$REPO_URL" "$APP_DIR"
              fi
            else
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
              git checkout develop
              git pull origin develop
            fi
            if [ ! -f "$APP_DIR/.env.dev" ]; then
              echo "ERROR: .env.dev missing on server — run initial deploy first"
              exit 1
            fi
            bash "$APP_DIR/deployments/scripts/deploy-dev.sh"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            curl -sf https://api.onreach.inovixora.fr/health
            curl -sf https://ai.onreach.inovixora.fr/health
            curl -sf -o /dev/null -w "%{http_code}" https://dev.onreach.inovixora.fr | grep -q 200
