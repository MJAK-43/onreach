name: Deploy DEV

# Pipeline develop : preflight → qualité backend/frontend → déploiement serveur.
# Le job deploy ne s'exécute que si tous les contrôles précédents réussissent.

on:
  workflow_dispatch:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    uses: ./.github/workflows/reusable-preflight.yml

  backend-quality:
    needs: preflight
    uses: ./.github/workflows/reusable-backend-quality.yml

  frontend-quality:
    needs: preflight
    uses: ./.github/workflows/reusable-frontend-quality.yml

  deploy:
    needs: [preflight, backend-quality, frontend-quality]
    if: success()
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: Build deployment archive
        run: |
          ARCHIVE="${RUNNER_TEMP}/onreach-deploy.tar.gz"
          tar -czf "$ARCHIVE" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=backend/vendor \
            --exclude=backend/var \
            --exclude=frontend/dist \
            --exclude=frontend/node_modules \
            --exclude=.env \
            --exclude=backend/.env \
            --exclude=backend/.env.dev \
            --exclude=backend/.env.test \
            -C "${{ github.workspace }}" .
          ls -lh "$ARCHIVE"
          echo "DEPLOY_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload archive to DEV server
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEPLOY_ARCHIVE: ${{ env.DEPLOY_ARCHIVE }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_ARCHIVE" "${SSH_USER}@${SSH_HOST}:/tmp/onreach-deploy.tar.gz"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "test -f /tmp/onreach-deploy.tar.gz && ls -lh /tmp/onreach-deploy.tar.gz"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="/opt/onreach/app"
            mkdir -p "$APP_DIR"
            ARCHIVE="/tmp/onreach-deploy.tar.gz"
            if [ ! -f "$ARCHIVE" ]; then
              ARCHIVE="$(find /tmp -name 'onreach-deploy.tar.gz' -type f 2>/dev/null | head -1)"
            fi
            if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: deployment archive not found under /tmp"
              find /tmp -maxdepth 3 -type f 2>/dev/null | head -20 || true
              ls -la /tmp
              exit 1
            fi
            echo "Using archive: $ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"
            chmod +x "$APP_DIR"/deployments/scripts/*.sh "$APP_DIR"/backend/docker/entrypoint.sh 2>/dev/null || true
            if [ ! -f "$APP_DIR/.env.dev" ]; then
              echo "ERROR: .env.dev missing on server — run initial deploy first"
              exit 1
            fi
            bash "$APP_DIR/deployments/scripts/deploy-dev.sh"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            for i in $(seq 1 30); do
              API=$(curl -sf -o /dev/null -w "%{http_code}" https://api.onreach.inovixora.fr/health || echo "000")
              AI=$(curl -sf -o /dev/null -w "%{http_code}" https://ai.onreach.inovixora.fr/health || echo "000")
              DEV=$(curl -sf -o /dev/null -w "%{http_code}" https://dev.onreach.inovixora.fr/ || echo "000")
              echo "Attempt $i: api=$API ai=$AI dev=$DEV"
              if [ "$API" = "200" ] && [ "$AI" = "200" ] && [ "$DEV" = "200" ]; then
                curl -sf https://api.onreach.inovixora.fr/health
                echo
                curl -sf https://ai.onreach.inovixora.fr/health
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed after retries"
            exit 1
