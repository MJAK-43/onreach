name: Feature PR Automation

on:
  push:
    branches: ['feature/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-and-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, zip

      - name: Backend quality
        working-directory: backend
        run: |
          composer install --no-interaction
          mkdir -p config/jwt
          openssl genrsa -passout pass:test -out config/jwt/private.pem 4096
          openssl rsa -pubout -in config/jwt/private.pem -passin pass:test -out config/jwt/public.pem
          vendor/bin/php-cs-fixer fix
          vendor/bin/phpstan analyse --no-progress
          php bin/phpunit
        env:
          APP_ENV: test
          APP_SECRET: test
          DATABASE_URL: sqlite:///:memory:
          JWT_PASSPHRASE: test
          JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
          JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend quality
        working-directory: frontend
        run: |
          npm ci
          npm run lint:fix
          npm run typecheck
          npm run test
          npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ github.ref_name }}
          base: develop
          title: "feat: ${{ github.ref_name }}"
          body: |
            ## Résumé
            PR automatique depuis `${{ github.ref_name }}` vers `develop`.

            ## Checks exécutés
            - [x] PHPUnit
            - [x] PHPStan
            - [x] PHP CS Fixer
            - [x] ESLint
            - [x] TypeScript
            - [x] Vitest
            - [x] Build frontend

            ## Test plan
            - [ ] Vérifier le démarrage Docker
            - [ ] Vérifier `/health` backend
            - [ ] Vérifier le dashboard frontend
