name: Feature PR Automation

on:
  push:
    branches: ['feature/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  preflight:
    uses: ./.github/workflows/reusable-preflight.yml

  backend-quality:
    needs: preflight
    uses: ./.github/workflows/reusable-backend-quality.yml

  frontend-quality:
    needs: preflight
    uses: ./.github/workflows/reusable-frontend-quality.yml

  quality-and-pr:
    needs: [preflight, backend-quality, frontend-quality]
    if: success() && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure Pull Request exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin develop
          AHEAD=$(git rev-list --count origin/develop..HEAD || echo "0")
          if [ "$AHEAD" = "0" ]; then
            echo "Branch already up to date with develop — skip PR creation"
            exit 0
          fi
          if gh pr list --head "${{ github.ref_name }}" --base develop --state open --json number --jq length | grep -q '^0$'; then
            gh pr create \
              --base develop \
              --head "${{ github.ref_name }}" \
              --title "feat: ${{ github.ref_name }}" \
              --body-file - <<EOF
          ## Résumé
          PR automatique depuis \`${{ github.ref_name }}\` vers \`develop\`.

          ## Checks exécutés
          - [x] Preflight (LF shell scripts)
          - [x] PHPUnit + PHPStan + CS Fixer
          - [x] ESLint + TypeScript + Vitest + Build
          EOF
          else
            echo "Open PR already exists for ${GITHUB_REF_NAME}"
          fi
