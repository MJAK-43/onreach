name: Feature PR Automation

on:
  push:
    branches: ['feature/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  quality-and-pr:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, zip

      - name: Backend quality
        working-directory: backend
        run: |
          cp .env.test .env
          composer install --no-interaction
          mkdir -p config/jwt
          openssl genrsa -passout pass:test -out config/jwt/private.pem 4096
          openssl rsa -pubout -in config/jwt/private.pem -passin pass:test -out config/jwt/public.pem
          vendor/bin/php-cs-fixer fix
          vendor/bin/phpstan analyse --no-progress --memory-limit=512M
          php bin/phpunit
        env:
          APP_ENV: test
          APP_SECRET: test
          DATABASE_URL: "sqlite:///:memory:"
          JWT_PASSPHRASE: test
          JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
          JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
          DEFAULT_URI: http://localhost
          MAILER_DSN: "null://null"
          MAILER_FROM: noreply@onreach.test
          FRONTEND_URL: http://localhost:5173

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend quality
        working-directory: frontend
        run: |
          npm ci
          npm run lint:fix
          npm run typecheck
          npm run test
          npm run build

      - name: Ensure Pull Request exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin develop
          AHEAD=$(git rev-list --count origin/develop..HEAD || echo "0")
          if [ "$AHEAD" = "0" ]; then
            echo "Branch already up to date with develop — skip PR creation"
            exit 0
          fi
          if gh pr list --head "${{ github.ref_name }}" --base develop --state open --json number --jq length | grep -q '^0$'; then
            gh pr create \
              --base develop \
              --head "${{ github.ref_name }}" \
              --title "feat: ${{ github.ref_name }}" \
              --body-file - <<EOF
          ## Résumé
          PR automatique depuis \`${{ github.ref_name }}\` vers \`develop\`.

          ## Checks exécutés
          - [x] PHPUnit
          - [x] PHPStan
          - [x] PHP CS Fixer
          - [x] ESLint
          - [x] TypeScript
          - [x] Vitest
          - [x] Build frontend
          EOF
          else
            echo "Open PR already exists for ${GITHUB_REF_NAME}"
          fi
