name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main, preprod, 'feature/**']
    paths:
      - 'frontend/**'
      - 'deployments/**'
      - '.gitattributes'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/reusable-frontend-quality.yml'
      - '.github/workflows/reusable-preflight.yml'
  pull_request:
    branches: [main, preprod, develop]
    paths:
      - 'frontend/**'
      - 'deployments/**'

jobs:
  preflight:
    uses: ./.github/workflows/reusable-preflight.yml

  quality:
    needs: preflight
    uses: ./.github/workflows/reusable-frontend-quality.yml
