name: Security

on:
  workflow_dispatch:
  push:
    branches: [main, preprod, develop]
  pull_request:
    branches: [main, preprod, develop]
  schedule:
    - cron: '0 6 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Upload SARIF requires Code Scanning enabled in repo settings.
      # Settings → Code security → Code scanning → Set up → CodeQL
      - name: Perform CodeQL Analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: CodeQL upload notice
        if: steps.codeql-analyze.outcome == 'failure'
        run: |
          echo "::warning::Code Scanning n'est pas activé sur ce dépôt."
          echo "Pour activer l'upload SARIF : GitHub → Settings → Code security → Code scanning → CodeQL"
          echo "L'analyse CodeQL a bien tourné ; seul l'envoi des résultats a échoué."

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
