# On'Reach — Environnement DEV (serveur)
# SSL terminé par Plesk (Let's Encrypt) → proxy vers Traefik 127.0.0.1:8200

name: onreach-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/onreach/docker/postgres/data:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onreach_dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /opt/onreach/docker/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onreach_dev

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /opt/onreach/docker/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - onreach_dev

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "-c", "sleep 8 && sh /init-buckets.sh"]
    networks:
      - onreach_dev
    restart: "no"

  backend:
    build:
      context: ../backend
      target: dev
    restart: unless-stopped
    volumes:
      - ../backend:/var/www/html
      - ../backend/docker/php.ini:/usr/local/etc/php/conf.d/onreach.ini:ro
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      DEFAULT_URI: ${DEFAULT_URI:-https://api.onreach.inovixora.fr}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-noreply@onreach.inovixora.fr}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.onreach.inovixora.fr}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onreach_dev

  backend-nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../backend:/var/www/html:ro
      - ../docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8202:80"
    depends_on:
      - backend
    networks:
      - onreach_dev

  frontend:
    build:
      context: ../frontend
      target: prod
      args:
        VITE_API_URL: https://api.onreach.inovixora.fr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8201:80"
    networks:
      - onreach_dev

  ai-service:
    build:
      context: ../ai-service
    restart: unless-stopped
    environment:
      APP_ENV: dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8203:8000"
    networks:
      - onreach_dev

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - onreach_dev

  prometheus:
    image: prom/prometheus:v3.3.1
    restart: unless-stopped
    volumes:
      - ../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/onreach/docker/prometheus/data:/prometheus
    networks:
      - onreach_dev

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - /opt/onreach/docker/loki/data:/loki
    networks:
      - onreach_dev

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
    volumes:
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/onreach/docker/grafana/data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - onreach_dev

volumes:
  backend_vendor:

networks:
  onreach_dev:
    name: onreach_dev
